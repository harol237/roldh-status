# Página de estado de Roldh Studio: https://status.roldhstudio.com
# Solo se publican aquí los sitios con permiso expreso. Los sitios de clientes que no lo han dado se vigilan
# en privado (Worker «roldh-vigilancia» del repositorio roldh-studio-web), nunca en este repositorio público.
# Para hacer público un cliente: añadirlo en `sites` y quitarlo de vigilancia/sitios.json en roldh-studio-web.
owner: harol237
repo: roldh-status
user-agent: harol237

sites:
  - name: Roldh Studio
    url: https://roldhstudio.com
    slug: roldhstudio
    icon: https://roldhstudio.com/favicon-32x32.png
    maxResponseTime: 10000

assignees:
  - harol237

skipDescriptionUpdate: true
skipTopicsUpdate: true

status-website:
  cname: status.roldhstudio.com
  name: Estado de Roldh Studio
  logoUrl: https://status.roldhstudio.com/logo.svg
  favicon: https://status.roldhstudio.com/favicon.png
  faviconSvg: https://status.roldhstudio.com/favicon.svg
  themeUrl: https://status.roldhstudio.com/roldh.css
  introTitle: "Estado de los servicios de **Roldh Studio**"
  introMessage: "Comprobamos cada 5 minutos que nuestros servicios responden. Si algo falla, lo sabemos al momento y nos ponemos a resolverlo. Volver a [roldhstudio.com](https://roldhstudio.com)."
  navbar:
    - title: Estado
      href: /
    - title: roldhstudio.com
      href: https://roldhstudio.com
  customHeadHtml: '<meta property="og:image" content="https://roldhstudio.com/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:image" content="https://roldhstudio.com/og-image.png">'
  metaTags:
    - name: twitter:card
      content: summary_large_image
    - name: description
      content: "Estado en tiempo real de los servicios de Roldh Studio: disponibilidad y tiempo de respuesta."
    - name: color-scheme
      content: "light dark"

